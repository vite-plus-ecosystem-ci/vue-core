packages:
  - 'packages/*'
  - 'packages-private/*'

catalog:
  '@babel/parser': ^7.29.12
  '@babel/types': ^7.29.11
  'entities': '^7.0.1'
  'estree-walker': ^2.0.2
  'vite': npm:@voidzero-dev/vite-plus-core@0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  '@vitejs/plugin-vue': ^6.0.10
  'magic-string': ^0.30.21
  'source-map-js': ^1.2.2
  vitest: 5.1.0
  vite-plus: 0.0.0-commit.a86fd1603196e23718d16144a472ad91b4ba21be
  '@vitest/browser-playwright': 5.1.0
  '@vitest/coverage-v8': 5.1.0
  '@vitest/ui': 5.1.0

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  'esbuild': true
  'puppeteer': true
  'simple-git-hooks': true
  'unrs-resolver': true
  'vue-demi': true

dedupePeers: true

peerDependencyRules:
  allowedVersions:
    'typescript-eslint>eslint': '^9.0.0'
    '@typescript-eslint/eslint-plugin>eslint': '^9.0.0'
    '@typescript-eslint/parser>eslint': '^9.0.0'
    '@typescript-eslint/type-utils>eslint': '^9.0.0'
    '@typescript-eslint/utils>eslint': '^9.0.0'
    vite: '*'
    vitest: '*'
  allowAny:
    - vite
    - vitest

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # ecosystem-ci smoke test: preview builds and freshly pinned toolchain packages
  - '@oxc-project/*'
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - vitest
  - '@vitest/*'
  - tinybench
  - yuku-core
  - yuku-parser
  - '@yuku-core/*'
  - '@yuku-toolchain/*'
  # ecosystem-ci smoke test: preview builds carry no provenance and are brand new
  - vite-plus
  - '@voidzero-dev/*'
  # Renovate security update: postcss@8.5.23
  - postcss@8.5.23
  # Renovate security update: minimatch@11.0.1
  - minimatch@11.0.1
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

trustPolicy: no-downgrade
trustPolicyExclude:
  # ecosystem-ci smoke test: preview builds carry no provenance and are brand new
  - vite-plus
  - '@voidzero-dev/*'
